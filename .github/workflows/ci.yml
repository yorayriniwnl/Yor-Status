name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-that-is-not-used-in-production-0123456789
      ADMIN_SETUP_KEY: ci-only-admin-setup-key
      YORSTATUS_DISABLE_CRON: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Design contract
        run: npm run design:check
      - name: Dataset currentness boundary
        shell: bash
        run: |
          if grep -R --line-number -E "live Yor Votes database|You have access to live data from the app database|Samrat Choudhary|current public rating|most charged politicians right now" README.md frontend backend/routes/chat.js; then
            echo "Unbounded current-world political claim detected"
            exit 1
          fi
          grep -q "Do not rank, recommend, endorse, or oppose political actors or parties" backend/routes/chat.js
          grep -q "Seed Dataset" frontend/index.html
      - name: Auth secret boundary
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings "changeme123" backend; then
            echo "Hard-coded admin setup fallback detected"
            exit 1
          fi
          grep -q "const SETUP_KEY = process.env.ADMIN_SETUP_KEY" backend/routes/auth.js
          grep -q "if (!SETUP_KEY)" backend/routes/auth.js
          grep -q "ADMIN_SETUP_KEY=" backend/.env.example
      - name: Compile backend JavaScript
        run: |
          find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 |
          xargs -0 -n1 node --check
      - name: Build packaged demo
        run: npm run build