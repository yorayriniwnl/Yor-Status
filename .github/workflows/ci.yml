name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-that-is-not-used-in-production-0123456789
      ADMIN_SETUP_KEY: ci-only-admin-setup-key
      YORSTATUS_DISABLE_CRON: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Design contract
        run: npm run design:check
      - name: Compile backend JavaScript
        run: |
          find backend -type f -name '*.js' -not -path '*/node_modules/*' -print0 |
          xargs -0 -n1 node --check
      - name: Build packaged demo
        run: npm run build
